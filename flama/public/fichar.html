<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0b0a">
<title>Fichar · Flama</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preload" href="/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Anton;src:url(/fonts/anton.woff2) format("woff2");font-display:swap}
@font-face{font-family:Archivo;src:url(/fonts/archivo-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Archivo;src:url(/fonts/archivo-900.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/fonts/jbm-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--y:#f6c91c;--k:#0c0b0a;--k2:#161412;--k3:#211e1b;--w:#f4efe6;--mut:#9b948a;--line:#2c2824;--ok:#5ad67d;--bad:#ff5a47;--blue:#5ab4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--k);color:var(--w);font-family:Archivo,system-ui,sans-serif;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;user-select:none}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.left{display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,4vw,48px);border-right:3px solid var(--y);background:radial-gradient(circle at 20% 10%,#f6c91c14,transparent 60%)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:56px;border-radius:50%}
.brand b{font-family:Anton;font-weight:400;font-size:34px;letter-spacing:.04em;line-height:1;display:block}
.brand .mono{color:var(--y)}
.clock{font-family:Anton;font-weight:400;font-size:clamp(90px,14vw,190px);line-height:.9;letter-spacing:.01em}
.date{color:var(--mut);font-size:clamp(16px,1.8vw,22px);font-weight:700;margin-top:10px}
.date::first-letter{text-transform:uppercase}
.now h3{font-family:"JetBrains Mono";font-size:12px;letter-spacing:.16em;color:var(--mut);margin:0 0 10px;text-transform:uppercase}
.now div{display:flex;gap:8px;flex-wrap:wrap}
.now span{background:#5ad67d1a;border:1px solid var(--ok);color:var(--ok);padding:7px 12px;font-weight:900;font-size:15px}
.now p{color:var(--mut);margin:0}
.right{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px}
.right h1{font-family:Anton;font-weight:400;font-size:clamp(34px,4vw,52px);text-transform:uppercase;margin:0;text-align:center;line-height:1}
.dots{display:flex;gap:16px;height:26px}
.dots i{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--mut);transition:background .15s,border-color .15s}
.dots i.on{background:var(--y);border-color:var(--y)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,minmax(76px,104px));gap:12px}
.pad button{aspect-ratio:1.15;background:var(--k3);border:1.5px solid var(--line);color:var(--w);font-family:Anton;font-size:40px;cursor:pointer;transition:transform .08s,background .15s}
.pad button:active{transform:scale(.94);background:var(--y);color:var(--k)}
.pad .fn{font-family:Archivo;font-weight:900;font-size:15px;color:var(--mut)}
.pad .ok{background:var(--y);color:var(--k);font-family:Archivo;font-weight:900;font-size:18px}
.msg{font-weight:900;min-height:24px;color:var(--bad);text-align:center}
.res{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5}
.res.on{display:flex;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.res.in{background:var(--ok);color:var(--k)}.res.out{background:var(--blue);color:var(--k)}
.res .ic{font-size:90px;line-height:1}
.res h2{font-family:Anton;font-weight:400;font-size:clamp(54px,9vw,120px);text-transform:uppercase;margin:0;line-height:.95}
.res p{font-size:clamp(20px,2.4vw,30px);font-weight:900;margin:0}
.res small{font-family:"JetBrains Mono";font-size:14px;letter-spacing:.1em;opacity:.75;text-transform:uppercase}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}.left{border-right:0;border-bottom:3px solid var(--y);gap:16px}.clock{font-size:80px}.now{display:none}}
</style>
</head>
<body>
<div class="left">
<div class="brand"><img src="/img/logo-round.webp" alt=""><div><b>FLAMA</b><span class="mono">Fichero de personal</span></div></div>
<div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
<div class="now"><h3>Trabajando ahora</h3><div id="now"><p>—</p></div></div>
</div>
<div class="right">
<h1>Poné tu PIN</h1>
<div class="dots" id="dots" aria-live="polite"><i></i><i></i><i></i><i></i></div>
<div class="pad" id="pad"></div>
<div class="msg" id="msg" role="alert"></div>
</div>
<div class="res" id="res" role="status"><div class="ic" id="ric"></div><h2 id="rh"></h2><p id="rp"></p><small id="rs"></small></div>
<script>
const KEY = new URLSearchParams(location.search).get("key") || "";
const $ = (id) => document.getElementById(id);
const TZ = "America/Argentina/Buenos_Aires";
const hora = (t) => new Date(t).toLocaleTimeString("es-AR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
let pin = "", busy = false;
function tick() { const d = new Date(); $("clock").textContent = hora(d); $("date").textContent = d.toLocaleDateString("es-AR", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" }); }
tick(); setInterval(tick, 5000);
function dots() { const n = Math.max(4, pin.length); $("dots").innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < pin.length ? "on" : ""}"></i>`).join(""); }
function press(k) {
  if (busy) return; $("msg").textContent = "";
  if (k === "borrar") pin = pin.slice(0, -1);
  else if (k === "ok") return enviar();
  else if (pin.length < 8) pin += k;
  dots();
}
["1", "2", "3", "4", "5", "6", "7", "8", "9", "borrar", "0", "ok"].forEach((k) => {
  const b = document.createElement("button"); b.type = "button";
  b.textContent = k === "borrar" ? "⌫ Borrar" : k === "ok" ? "Fichar" : k; if (k === "borrar") b.className = "fn"; if (k === "ok") b.className = "ok";
  b.setAttribute("aria-label", k === "borrar" ? "Borrar" : k === "ok" ? "Fichar" : k); b.onclick = () => press(k); $("pad").append(b);
});
addEventListener("keydown", (e) => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("borrar"); else if (e.key === "Enter") press("ok"); });
async function enviar() {
  if (pin.length < 4) { $("msg").textContent = "El PIN tiene 4 números o más"; return; }
  busy = true;
  try {
    const r = await fetch(`/api/fichar?key=${encodeURIComponent(KEY)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || "Error");
    const entra = d.tipo === "entrada";
    $("res").className = "res on " + (entra ? "in" : "out");
    $("ric").textContent = entra ? "👋" : "✌️";
    $("rh").textContent = entra ? `¡Hola ${d.nombre}!` : `¡Chau ${d.nombre}!`;
    $("rp").textContent = entra ? `Entrada ${hora(d.hora)}` : `Salida ${hora(d.hora)} · trabajaste ${Math.floor(d.minutos / 60)} h ${d.minutos % 60} min`;
    $("rs").textContent = d.repetido ? "Ya habías fichado la entrada" : entra ? "Buen turno 🔥" : "Gracias por hoy";
    setTimeout(() => ($("res").className = "res"), 3500);
    cargar();
  } catch (e) {
    $("msg").textContent = e.message === "Clave incorrecta" ? "Este link no es válido. Pedile el link al encargado." : e.message;
    $("dots").classList.remove("shake"); void $("dots").offsetWidth; $("dots").classList.add("shake");
  } finally { pin = ""; dots(); busy = false; }
}
async function cargar() {
  try {
    const d = await (await fetch(`/api/fichar?key=${encodeURIComponent(KEY)}`)).json();
    $("now").innerHTML = d.ahora?.length ? d.ahora.map((a) => `<span>🟢 ${a.nombre.replace(/[<>&]/g, "")} · ${hora(a.desde)}</span>`).join("") : "<p>Nadie fichó todavía.</p>";
  } catch {}
}
dots(); cargar(); setInterval(cargar, 60000);
</script>
</body>
</html>
