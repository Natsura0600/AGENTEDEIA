<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0b0a">
<title>Pedidos · Flama</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preload" href="/fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Anton;src:url(/fonts/anton.woff2) format("woff2");font-display:swap}
@font-face{font-family:Archivo;src:url(/fonts/archivo-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Archivo;src:url(/fonts/archivo-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Archivo;src:url(/fonts/archivo-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:Archivo;src:url(/fonts/archivo-900.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/fonts/jbm-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/fonts/jbm-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--y:#f6c91c;--k:#0c0b0a;--k2:#161412;--k3:#211e1b;--k4:#2a2622;--w:#f4efe6;--mut:#9b948a;--line:#2c2824;--ok:#5ad67d;--warn:#ff9f1c;--bad:#ff5a47;--blue:#5ab4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--k);color:var(--w);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.mono{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* HEADER */
header{position:sticky;top:0;z-index:10;background:#0c0b0af2;backdrop-filter:blur(10px);border-bottom:3px solid var(--y);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:44px;height:44px;border-radius:50%}
.brand b{font-family:Anton;font-weight:400;font-size:28px;letter-spacing:.04em;line-height:1;display:block}
.brand .mono{color:var(--y)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbtn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;background:var(--k3);color:var(--w);border:1.5px solid var(--line);min-height:42px;padding:0 14px;font-weight:800;font-size:13px;letter-spacing:.02em;transition:border-color .2s,background .2s}
.tbtn:hover{border-color:var(--mut)}
.tbtn.on{border-color:var(--ok);color:var(--ok)}
.tbtn.off{background:var(--bad);border-color:var(--bad);color:#fff}
.tbtn.yel{background:var(--y);border-color:var(--y);color:var(--k)}
.mes input{background:transparent;border:0;color:inherit;font:inherit;color-scheme:dark;width:132px}
.live{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--mut)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
.live.offline i{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 #5ad67d88}70%{box-shadow:0 0 0 10px #5ad67d00}100%{box-shadow:0 0 0 0 #5ad67d00}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 20px 4px}
.kpi{background:var(--k2);border:1.5px solid var(--line);padding:14px 16px;position:relative;overflow:hidden}
.kpi .mono{color:var(--mut)}
.kpi b{display:block;font-family:Anton;font-weight:400;font-size:clamp(30px,3.2vw,44px);line-height:1;margin-top:8px}
.kpi.main{background:var(--y);border-color:var(--y);color:var(--k)}
.kpi.main .mono{color:#0c0b0aa8}
.kpi.alert b{color:var(--warn)}

/* MOBILE TABS */
.mtabs{display:none;gap:6px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none}
.mtabs button{flex:none;background:var(--k2);border:1.5px solid var(--line);color:var(--w);min-height:44px;padding:0 14px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.mtabs button span{background:var(--k4);border-radius:999px;padding:2px 8px;font-family:"JetBrains Mono";font-size:12px}
.mtabs button[aria-selected="true"]{background:var(--w);color:var(--k);border-color:var(--w)}
.mtabs button[aria-selected="true"] span{background:var(--k);color:var(--y)}

/* BOARD */
.board{display:grid;grid-template-columns:repeat(4,minmax(270px,1fr));gap:16px;padding:18px 20px 40px;align-items:start}
.col h2{font-family:Anton;font-weight:400;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.col h2 span{font-family:"JetBrains Mono";font-size:13px;background:var(--k3);border:1.5px solid var(--line);color:var(--y);min-width:30px;height:28px;display:grid;place-items:center;padding:0 8px}
.list{display:flex;flex-direction:column;gap:12px}
.empty{color:var(--mut);font-size:14px;border:1.5px dashed var(--line);padding:26px 16px;text-align:center}
.empty b{display:block;font-size:26px;margin-bottom:6px}

/* CARD */
.card{--c:var(--line);background:var(--k2);border:1.5px solid var(--line);border-left:6px solid var(--c);padding:14px 16px 16px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card.nuevo{animation:in .35s ease both,flash 2.6s ease}
@keyframes flash{0%,40%{background:#f6c91c2e;box-shadow:0 0 0 3px var(--y),0 0 30px #f6c91c55}100%{background:var(--k2);box-shadow:none}}
.e-pago_pendiente{--c:var(--y)}.e-pago_a_verificar{--c:var(--bad)}.e-programado{--c:var(--blue)}.e-en_preparacion{--c:var(--ok)}
.e-listo,.e-en_camino{--c:var(--blue)}.e-entregado{--c:#4a453f;opacity:.72}.e-cancelado{--c:#4a453f;opacity:.5}
.e-cancelado .num{text-decoration:line-through}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.num{font-family:Anton;font-weight:400;font-size:42px;line-height:.9;letter-spacing:.01em}
.chips{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 9px;background:var(--k4);white-space:nowrap}
.chip.env{background:#5ab4ff22;color:var(--blue)}.chip.ret{background:#f6c91c22;color:var(--y)}
.ago{font-family:"JetBrains Mono";font-size:12px;font-weight:700;color:var(--mut)}
.ago.warn{color:var(--warn)}
.ago.late{color:#fff;background:var(--bad);padding:3px 8px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.6}}
.who{font-weight:900;font-size:18px;margin:10px 0 2px}
.meta{color:var(--mut);font-size:13px;line-height:1.5}
.meta.dir{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.maplink{flex:none;color:var(--blue);font-weight:800;font-size:12px;text-decoration:none;border:1px solid #5ab4ff55;padding:2px 8px}
.meta.warnz{color:var(--y);font-weight:700}
.items{list-style:none;margin:12px 0;padding:10px 0;border-block:1px dashed var(--line);font-size:15px;line-height:1.45}
.items li{display:flex;gap:8px}
.items li b{color:var(--y);font-family:"JetBrains Mono";min-width:26px}
.nota{background:#f6c91c14;border-left:3px solid var(--y);padding:8px 10px;font-size:13px;margin-bottom:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot b{font-family:Anton;font-weight:400;font-size:26px}
.tot small{color:var(--mut);font-weight:500;font-size:12px}
.pay{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 10px;font-size:13px;font-weight:800;line-height:1.35}
.pay.ok{background:#5ad67d1a;color:var(--ok)}.pay.warn{background:#f6c91c1a;color:var(--y)}.pay.bad{background:#ff5a471a;color:var(--bad)}
.pay span{flex:1}
.thumb{width:52px;height:52px;flex:none;border:1.5px solid currentColor;padding:0;background:#000 center/cover;cursor:zoom-in}
.later{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;color:var(--blue)}
.go{width:100%;margin-top:14px;min-height:56px;border:0;background:var(--y);color:var(--k);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,background .2s}
.go:hover{background:#ffd83a}.go:active{transform:scale(.98)}
.go.green{background:var(--ok)}
.cancel{display:block;margin:10px auto 0;background:none;border:0;color:var(--mut);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.cancel:hover{color:var(--bad)}

.kpi.alert b{color:var(--bad)}
.stockalert{margin:12px 20px 0;background:#ff5a471a;border:1.5px solid var(--bad);color:#ffb3aa;padding:12px 14px;font-weight:800}
.chip.most{background:#5ad67d22;color:var(--ok)}
/* VENTA MOSTRADOR */
.mdlg{position:fixed;inset:0;z-index:60;display:none}
.mdlg.open{display:block}
.mdlg .bd{position:absolute;inset:0;background:#000c}
.mbox{position:absolute;right:0;top:0;bottom:0;width:min(920px,100%);background:var(--k2);border-left:3px solid var(--y);display:grid;grid-template-columns:1.3fr 1fr;animation:slide .3s cubic-bezier(.2,1,.3,1)}
@keyframes slide{from{transform:translateX(100%)}}
.mcat{overflow:auto;padding:18px;border-right:1.5px solid var(--line)}
.mcat h3{font-family:Anton;font-weight:400;font-size:26px;text-transform:uppercase;margin:4px 0 10px}
.mcat h4{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.14em;color:var(--y);text-transform:uppercase;margin:16px 0 8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pbtn{background:var(--k3);border:1.5px solid var(--line);color:var(--w);text-align:left;padding:12px;min-height:70px;font-weight:800;font-size:14px;line-height:1.2;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.pbtn small{font-family:"JetBrains Mono";color:var(--y);font-weight:700;font-size:12px}
.pbtn:hover{border-color:var(--y)}.pbtn:active{transform:scale(.97)}
.pbtn[disabled]{opacity:.35;cursor:not-allowed}
.mtick{display:flex;flex-direction:column;min-height:0}
.mtick .head{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1.5px solid var(--line)}
.mtick .head h3{font-family:Anton;font-weight:400;font-size:26px;text-transform:uppercase;margin:0}
.mlines{flex:1;overflow:auto;padding:4px 18px}
.mline{padding:12px 0;border-bottom:1px solid var(--line)}
.mline .r1{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.mline .r2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.seg2{display:inline-flex;border:1.5px solid var(--line)}
.seg2 button{background:none;border:0;color:var(--mut);font-weight:800;font-size:12px;padding:6px 10px;min-height:34px;text-transform:uppercase}
.seg2 button[aria-pressed="true"]{background:var(--w);color:var(--k)}
.stp{display:inline-flex;align-items:center;border:1.5px solid var(--line);font-size:12px;font-weight:800;color:var(--mut)}
.stp span{padding:0 6px}.stp b{min-width:18px;text-align:center;color:var(--w);font-family:"JetBrains Mono"}
.stp button{background:none;border:0;color:var(--w);width:32px;height:32px;font-weight:900;font-size:15px}
.vgb{background:none;border:1.5px solid var(--line);color:var(--mut);font-weight:800;font-size:12px;min-height:34px;padding:0 10px}
.vgb[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:#5ad67d1a}
.mnom{width:100%;background:var(--k);color:var(--w);border:1.5px solid var(--line);padding:11px 12px;font:inherit;margin-bottom:12px}
.mnom:focus{border-color:var(--y);outline:0}
.mfoot{padding:16px 18px;border-top:1.5px solid var(--line);background:var(--k3)}
.mfoot .tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.mfoot .tot b{font-family:Anton;font-weight:400;font-size:40px;color:var(--y)}
.pago3{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);margin-bottom:12px}
.pago3 button{background:none;border:0;color:var(--w);font-weight:800;min-height:46px}
.pago3 button[aria-pressed="true"]{background:var(--w);color:var(--k)}
.mvacio{color:var(--mut);text-align:center;padding:40px 10px}
.tst{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:var(--k);font-weight:900;padding:14px 20px;z-index:70;box-shadow:0 10px 30px #000a}
.tst.err{background:var(--bad);color:#fff}
#mclose{flex:none;width:44px;justify-content:center}
@media(max-width:800px){.mbox{grid-template-columns:1fr;grid-template-rows:1fr auto}.mcat{border-right:0;border-bottom:1.5px solid var(--line)}.mtick{max-height:52vh}}
/* LIGHTBOX */
.lb{position:fixed;inset:0;z-index:50;background:#000d;display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.open{display:grid}
.lb img{max-width:min(560px,100%);max-height:88vh;border:3px solid var(--y)}

@media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr);padding:14px 16px 0}
  .mtabs{display:flex}
  .board{grid-template-columns:1fr;padding:14px 16px 40px}
  .col{display:none}.col.active{display:block}
  .col h2{display:none}
  header{padding:10px 14px}
  .tools{width:100%}
  .tbtn{flex:1 1 auto;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.login{position:fixed;inset:0;z-index:100;background:#0c0b0a;display:grid;place-items:center;padding:20px}
.login form{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:6px;background:#161412;border:1.5px solid #2c2824;border-top:4px solid #f6c91c;padding:28px 24px}
.login img{width:64px;height:64px;border-radius:50%}
.login b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.04em;line-height:1;margin-top:6px}
.login span{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#f6c91c;margin-bottom:14px}
.login label{align-self:flex-start;font-size:12px;font-weight:800;color:#9b948a;text-transform:uppercase;letter-spacing:.06em}
.login input{width:100%;background:#0c0b0a;color:#f4efe6;border:1.5px solid #2c2824;padding:12px;font:inherit;font-size:16px}
.login input:focus{border-color:#f6c91c;outline:0}
.login button{width:100%;margin-top:10px;background:#f6c91c;color:#0c0b0a;border:0;min-height:50px;font:inherit;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.login p{color:#ff5a47;font-weight:800;min-height:20px;margin:6px 0 0}
</style>
</head>
<body>
<header>
<div class="brand"><img src="/img/logo-round.webp" alt=""><div><b>FLAMA</b><span class="mono">Panel de pedidos</span></div></div>
<div class="live" id="live"><i aria-hidden="true"></i><span id="status">En vivo</span></div>
<div class="tools">
<button type="button" id="botbtn" class="tbtn">🤖 Bot …</button>
<button type="button" id="sndbtn" class="tbtn">🔇 Activar sonido</button>
<a class="tbtn" id="fichlink" href="#" target="_blank" rel="noopener">🕘 Fichar</a>
<button type="button" id="mostbtn" class="tbtn yel">＋ Venta mostrador</button>
</div>
</header>

<section class="kpis" aria-label="Resumen de hoy">
<div class="kpi main" id="k-curso-box"><span class="mono">En curso</span><b id="k-curso">0</b></div>
<div class="kpi"><span class="mono">Esperando pago</span><b id="k-pago">0</b></div>
<div class="kpi"><span class="mono">Entregados hoy</span><b id="k-ped">0</b></div>
<div class="kpi" id="k-stock-box"><span class="mono">Stock bajo</span><b id="k-stock">0</b></div>
</section>
<div class="stockalert" id="stockalert" hidden></div>

<nav class="mtabs" id="mtabs" role="tablist" aria-label="Columnas"></nav>
<main class="board" id="board" aria-live="polite"></main>
<div class="lb" id="lb" role="dialog" aria-label="Comprobante"><img id="lbimg" alt="Comprobante de transferencia"></div>
<div class="mdlg" id="mdlg" role="dialog" aria-modal="true" aria-label="Venta de mostrador"><div class="bd" id="mbd"></div>
<div class="mbox"><div class="mcat"><h3>Venta de mostrador</h3><div id="mcat"></div></div>
<div class="mtick"><div class="head"><h3>Ticket</h3><button class="tbtn" id="mclose" type="button" aria-label="Cerrar">✕</button></div><div class="mlines" id="mlines"></div>
<div class="mfoot"><input id="mnombre" class="mnom" placeholder="Nombre o número de mesa (opcional)" maxlength="40" aria-label="Nombre o mesa"><div class="tot"><span class="mono">Total</span><b id="mtotal">$0</b></div>
<div class="pago3" role="group" aria-label="Forma de pago"><button type="button" data-pago="efectivo" aria-pressed="true">💵 Efectivo</button><button type="button" data-pago="transferencia" aria-pressed="false">🏦 Transf.</button><button type="button" data-pago="tarjeta" aria-pressed="false">💳 Tarjeta</button></div>
<button class="go green" type="button" id="mok">Cobrado → mandar a cocina</button></div></div></div></div>

<script>
let key = "";
// ---- Ingreso con clave (se guarda en este dispositivo, así el link queda limpio) ----
function sesion(store, probar, titulo) {
  // El link de acceso trae la clave después de "#" (nunca llega al servidor) o, en links viejos, en ?key=
  const qs = new URLSearchParams(location.search), hs = new URLSearchParams(location.hash.slice(1));
  let k = hs.get("key") || qs.get("key");
  if (k) { try { localStorage.setItem(store, k); } catch {} qs.delete("key"); history.replaceState(null, "", location.pathname + (qs.toString() ? "?" + qs : "")); }
  else { try { k = localStorage.getItem(store); } catch {} }
  return (async () => (k && (await probar(k).catch(() => false))) ? k : pedirClave(store, probar, titulo))();
}
function pedirClave(store, probar, titulo) {
  return new Promise((resolve) => {
    const o = document.createElement("div"); o.className = "login";
    o.innerHTML = `<form><img src="/img/logo-round.webp" alt=""><b>FLAMA</b><span>${titulo}</span><label for="lk">Clave</label><input id="lk" type="password" autocomplete="current-password" required><button type="submit">Entrar</button><p role="alert"></p></form>`;
    document.body.append(o); const f = o.querySelector("form"), inp = o.querySelector("input"), msg = o.querySelector("p"); inp.focus();
    f.onsubmit = async (e) => {
      e.preventDefault(); const v = inp.value.trim(); msg.textContent = "";
      if (await probar(v).catch(() => false)) { try { localStorage.setItem(store, v); } catch {} o.remove(); resolve(v); }
      else { msg.textContent = "Clave incorrecta"; inp.select(); }
    };
  });
}
function salir(store) { try { localStorage.removeItem(store); } catch {} location.reload(); }

const COLS = [
  { id: "pago", title: "Pagos", estados: ["pago_pendiente", "pago_a_verificar"] },
  { id: "cocina", title: "En cocina", estados: ["en_preparacion", "programado"] },
  { id: "listos", title: "Listos / en camino", estados: ["listo", "en_camino"] },
  { id: "fin", title: "Entregados", estados: ["entregado", "cancelado"] },
];
const ACTIVOS = ["pago_pendiente", "pago_a_verificar", "programado", "en_preparacion", "listo", "en_camino"];
const money = (n) => "$" + Number(n || 0).toLocaleString("es-AR");
const hhmm = (t) => new Date(t).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
const $ = (id) => document.getElementById(id);
// La clave va en un encabezado, nunca en la dirección
const api = (url, o = {}) => fetch(url, { ...o, headers: { ...(o.headers || {}), "x-flama-key": key } });
let ver = "", jor = "", desde = 0, ORD = new Map(), stockBajo = [], ultimoCambio = Date.now(), known = new Set(), first = true, sound = false, botOn = true, actx, activeCol = "pago", lastData = null;

function ding() {
  if (!sound) return;
  actx = actx || new AudioContext();
  [0, .18, .36].forEach((t, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = [880, 1175, 1568][i]; o.type = "triangle";
    g.gain.setValueAtTime(.0001, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.4, actx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t + .3);
    o.connect(g).connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .32); });
}
$("sndbtn").onclick = (e) => { sound = !sound; e.currentTarget.textContent = sound ? "🔔 Sonido activado" : "🔇 Activar sonido"; e.currentTarget.classList.toggle("on", sound); if (sound) { actx = actx || new AudioContext(); ding(); } };

function paintBot() { const b = $("botbtn"); b.textContent = botOn ? "🤖 Bot prendido" : "⛔ Bot apagado"; b.classList.toggle("off", !botOn); b.classList.toggle("on", botOn); }
$("botbtn").onclick = async () => {
  if (botOn && !confirm("¿Apagar el bot? Los clientes van a recibir: 'En un ratito te responde alguien del local'.")) return;
  await api("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ bot: botOn ? "off" : "on" }) });
  botOn = !botOn; paintBot();
};
function paintKpis(c, orders, bajos = []) {
  if (c) $("k-ped").textContent = c.pedidos;
  if (orders) {
    const n = orders.filter((o) => ACTIVOS.includes(o.estado)).length; $("k-curso").textContent = n;
    $("k-pago").textContent = orders.filter((o) => ["pago_pendiente", "pago_a_verificar"].includes(o.estado)).length;
  }
  $("k-stock").textContent = bajos.length; $("k-stock-box").classList.toggle("alert", bajos.length > 0);
  const a = $("stockalert"); a.hidden = !bajos.length;
  a.textContent = bajos.length ? "⚠️ Avisale al encargado, queda poco: " + bajos.map((b) => `${b.nombre} (${Number(b.cant).toLocaleString("es-AR")} ${b.unidad})`).join(" · ") : "";
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(label, cls, onClick) { const b = el("button", cls, label); b.type = "button"; b.onclick = onClick; return b; }

// Sincronización: la primera vez baja todo el día; después solo los pedidos que cambiaron.
// Si no cambió nada, el servidor gasta 1 solo comando.
async function load(full) {
  try {
    const q = full || !ver ? "full=1" : `v=${ver}&j=${jor}&desde=${desde}`;
    const r = await api("/api/orders?" + q);
    if (r.status === 401) { try { localStorage.removeItem("flama_local"); } catch {} return location.reload(); }
    if (!r.ok) throw new Error();
    const d = await r.json(); botOn = d.botOn !== false; paintBot();
    if (d.stockBajo) stockBajo = d.stockBajo;
    if (!d.same) {
      if (d.full) ORD = new Map();
      for (const o of d.orders || []) ORD.set(o.id, o);
      if (d.orders?.length) ultimoCambio = Date.now();
      ver = d.ver; jor = d.jornada; desde = d.desde;
      const orders = [...ORD.values()];
      render({ orders }); paintKpis({ pedidos: orders.filter((o) => o.estado === "entregado").length }, orders, stockBajo);
    } else paintKpis(null, null, stockBajo);
    $("status").textContent = "En vivo"; $("live").classList.remove("offline");
  } catch { $("status").textContent = "Sin conexión"; $("live").classList.add("offline"); }
}
async function setEstado(id, estado) {
  const r = await api("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, estado }) });
  if (!r.ok) { const d = await r.json().catch(() => ({})); tst(d.error || "No se pudo actualizar", 1); }
  load();
}

// Comprobantes: se piden al servidor solo cuando hacen falta, y se guardan acá
const IMGS = new Map();
async function imgComprobante(o) {
  if (typeof o.comprobante?.imagen === "string") return o.comprobante.imagen;
  if (IMGS.has(o.id)) return IMGS.get(o.id);
  try { const d = await (await api("/api/orders?comp=" + o.id)).json(); IMGS.set(o.id, d.img); return d.img; } catch { return null; }
}
// Tiempo desde que entró el pedido: naranja a los 20 min, rojo a los 30
function agoText(t) { const m = Math.max(0, Math.floor((Date.now() - t) / 60000)); return m < 1 ? "recién" : m < 60 ? `hace ${m} min` : `hace ${Math.floor(m / 60)} h ${m % 60} min`; }
function paintAgo(e) {
  const t = Number(e.dataset.t), activo = e.dataset.activo === "1", m = (Date.now() - t) / 60000;
  e.textContent = agoText(t);
  e.classList.toggle("warn", activo && m >= 20 && m < 30); e.classList.toggle("late", activo && m >= 30);
}
setInterval(() => document.querySelectorAll(".ago").forEach(paintAgo), 30000);

function card(o, nuevo) {
  const c = el("article", `card e-${o.estado}${nuevo ? " nuevo" : ""}`);
  const top = el("div", "ctop");
  const left = el("div"); left.append(el("div", "num", "#" + o.id));
  const chips = el("div", "chips");
  chips.append(o.canal === "mostrador" ? el("span", "chip most", "🧾 Mostrador · " + (o.pago || "efectivo")) : el("span", "chip " + (o.entrega === "envio" ? "env" : "ret"), o.entrega === "envio" ? "🛵 Delivery" : "🏪 Retiro"));
  const ago = el("span", "ago"); ago.dataset.t = o.createdAt; ago.dataset.activo = ACTIVOS.includes(o.estado) ? "1" : "0"; ago.title = "Entró a las " + hhmm(o.createdAt); paintAgo(ago);
  chips.append(ago); top.append(left, chips); c.append(top);
  if (o.canal !== "mostrador" || o.nombre !== "Mostrador") c.append(el("div", "who", o.nombre || "Sin nombre"));
  if (o.entrega === "envio" && o.direccion) {
    // Dirección + km + zona, con botón para abrirla en Google Maps (para el repartidor)
    const d = el("div", "meta dir"); d.append(el("span", null, "📍 " + o.direccion));
    const q = o.geo ? `${o.geo.lat},${o.geo.lng}` : encodeURIComponent(o.direccion + ", Luján, Buenos Aires");
    const a = el("a", "maplink", "Mapa ↗"); a.href = "https://www.google.com/maps/search/?api=1&query=" + q; a.target = "_blank"; a.rel = "noopener"; d.append(a);
    c.append(d);
    const zt = [o.zonaNombre, o.geo ? (o.geo.exacta ? "" : "≈ ") + String(o.geo.km).replace(".", ",") + " km" : null].filter(Boolean).join(" · ");
    if (zt) c.append(el("div", "meta", "🛵 " + zt));
    if (o.zonaAConfirmar) c.append(el("div", "meta warnz", o.geo ? "⚠ Ubicación aproximada: confirmá la zona" : "⚠ No se pudo ubicar la dirección: confirmá la zona"));
  }
  if (o.telefono) c.append(el("div", "meta", "📱 +" + o.telefono));
  const ul = el("ul", "items");
  (o.lineas || []).forEach((l) => { const li = el("li"); const m = l.texto.match(/^(\d+)x (.+)$/); if (m) { li.append(el("b", null, m[1] + "×"), el("span", null, m[2])); } else li.append(el("span", null, l.texto)); ul.append(li); });
  c.append(ul);
  if (o.comentarios) c.append(el("div", "nota", "📝 " + o.comentarios));
  const t = el("div", "tot"); const tl = el("span", null, "Total "); if (o.envio) tl.append(el("small", null, `(envío ${money(o.envio)})`)); t.append(tl, el("b", null, money(o.total))); c.append(t);

  let pay = null;
  if (o.estado === "pago_pendiente") pay = ["warn", "⏳ Esperando comprobante"];
  else if (o.estado === "pago_a_verificar") pay = ["bad", "⚠️ Revisar pago: " + (o.comprobante?.motivos || []).join(", ")];
  else if (o.pagoVerificadoPor === "bot") pay = ["ok", "✓ Pago verificado por el bot"];
  else if (o.canal === "mostrador") pay = ["ok", "✓ Cobrado en mostrador · " + (o.pago || "efectivo")];
  else if (o.pagoVerificadoPor === "local") pay = ["ok", "✓ Pago verificado por el local"];
  if (pay || o.comprobante?.imagen) {
    const p = el("div", "pay " + (pay ? pay[0] : "ok"));
    if (o.comprobante?.imagen) {
      const th = btn("🧾", "thumb", async () => { const src = await imgComprobante(o); if (src) { $("lbimg").src = src; $("lb").classList.add("open"); } else tst("La imagen ya no está disponible", 1); });
      th.setAttribute("aria-label", "Ver comprobante del pedido " + o.id); p.append(th);
      if (o.estado === "pago_a_verificar") imgComprobante(o).then((src) => { if (src) { th.textContent = ""; th.style.backgroundImage = `url("${src}")`; } });
    }
    p.append(el("span", null, pay ? pay[1] : "Comprobante recibido")); c.append(p);
  }
  if (o.paraMasTarde && ["programado", "pago_pendiente"].includes(o.estado)) c.append(el("span", "later", "🕘 Pedido para más tarde"));

  const next = {
    pago_pendiente: ["Marcar pagado → cocina", "en_preparacion"],
    pago_a_verificar: ["Pago OK → cocina", "en_preparacion"],
    programado: ["Empezar a preparar", "en_preparacion"],
    en_preparacion: o.entrega === "envio" ? ["🛵 Salió el delivery", "en_camino"] : ["✓ Listo para retirar", "listo"],
    listo: ["Entregado", "entregado", "green"],
    en_camino: ["Entregado", "entregado", "green"],
  }[o.estado];
  if (next) c.append(btn(next[0], "go " + (next[2] || ""), () => setEstado(o.id, next[1])));
  if (ACTIVOS.includes(o.estado)) c.append(btn("Cancelar pedido", "cancel", () => { if (confirm(`¿Cancelar el pedido #${o.id}?`)) setEstado(o.id, "cancelado"); }));
  return c;
}
function render(d) {
  const board = $("board"); board.replaceChildren(); const tabs = $("mtabs"); tabs.replaceChildren();
  let nuevo = false;
  for (const col of COLS) {
    const items = d.orders.filter((o) => col.estados.includes(o.estado));
    if (col.id !== "fin") items.sort((a, b) => a.createdAt - b.createdAt); // los más viejos primero
    else items.sort((a, b) => b.updatedAt - a.updatedAt);
    const total = items.length; if (col.id === "fin" && items.length > 40) items.length = 40;
    const s = el("section", "col" + (col.id === activeCol ? " active" : "")); s.id = "col-" + col.id;
    const h = el("h2", null, col.title); h.append(el("span", null, String(total))); s.append(h);
    const list = el("div", "list");
    if (!items.length) { const e = el("div", "empty"); e.append(el("b", null, col.id === "fin" ? "🍔" : "—"), document.createTextNode("Sin pedidos por ahora")); list.append(e); }
    items.forEach((o) => { const isNew = !known.has(o.id) && !first; if (!known.has(o.id)) { nuevo = true; known.add(o.id); } list.append(card(o, isNew)); });
    s.append(list); board.append(s);
    const tb = el("button"); tb.type = "button"; tb.setAttribute("role", "tab"); tb.setAttribute("aria-selected", String(col.id === activeCol));
    tb.append(document.createTextNode(col.title), el("span", null, String(total)));
    tb.onclick = () => { activeCol = col.id; document.querySelectorAll(".col").forEach((x) => x.classList.toggle("active", x.id === "col-" + col.id)); tabs.querySelectorAll("button").forEach((x) => x.setAttribute("aria-selected", String(x === tb))); };
    tabs.append(tb);
  }
  if (nuevo && !first) { document.title = "🔔 Nuevo pedido · Flama"; ding(); }
  first = false;
}
// ---- Venta de mostrador ----
let carta = null, ticket = [], pago = "efectivo";
function tst(msg, err) { const t = el("div", "tst" + (err ? " err" : ""), msg); document.body.append(t); setTimeout(() => t.remove(), 2600); }
async function abrirMostrador() {
  try { carta = await (await fetch("/api/menu")).json(); } catch { if (!carta) return tst("No se pudo cargar el menú", 1); }
  const cat = $("mcat"); cat.replaceChildren();
  carta.categorias.forEach((c) => {
    const ps = carta.productos.filter((p) => p.cat === c.id); if (!ps.length) return;
    cat.append(el("h4", null, c.nombre)); const g = el("div", "pgrid");
    ps.forEach((p) => {
      const agot = p.estado === "agotado";
      const b = btn("", "pbtn", () => { ticket.push({ id: p.id, nombre: p.nombre, tam: p.tipo === "tamanos", tamano: "simple", cantidad: 1, veggie: false, ext: {} }); pintarTicket(); });
      b.append(el("span", null, p.nombre), el("small", null, agot ? "Agotado" : money(p.tipo === "tamanos" ? p.simple : p.precio))); b.disabled = agot; g.append(b);
    });
    cat.append(g);
  });
  pintarTicket(); $("mdlg").classList.add("open");
}
const prod = (id) => carta.productos.find((x) => x.id === id);
function precioLinea(l) {
  const p = prod(l.id); if (!p) return 0;
  const ex = Object.entries(l.ext).reduce((s, [id, n]) => s + n * (carta.extras.find((e) => e.id === id)?.precio || 0), 0);
  return ((l.tam ? p[l.tamano] : p.precio) + ex) * l.cantidad;
}
function pintarTicket() {
  const box = $("mlines"); box.replaceChildren();
  if (!ticket.length) box.append(el("div", "mvacio", "Tocá los productos de la izquierda para armar la venta."));
  ticket.forEach((l, idx) => {
    const p = prod(l.id);
    const r = el("div", "mline"); const r1 = el("div", "r1"); r1.append(el("span", null, l.nombre + (l.veggie ? " veggie" : "")), el("span", null, money(precioLinea(l))));
    const r2 = el("div", "r2");
    const stp = (lab, get, set, quitar) => { const s = el("span", "stp"); s.append(el("span", null, lab), btn("−", "", () => { set(Math.max(0, get() - 1)); if (quitar && !get()) ticket.splice(idx, 1); pintarTicket(); }), el("b", null, String(get())), btn("+", "", () => { set(get() + 1); pintarTicket(); })); return s; };
    r2.append(stp("Cant.", () => l.cantidad, (v) => (l.cantidad = v), true));
    if (l.tam) {
      const sg = el("span", "seg2"); ["simple", "doble"].forEach((t) => { const b = btn(t, "", () => { l.tamano = t; pintarTicket(); }); b.setAttribute("aria-pressed", String(l.tamano === t)); sg.append(b); });
      r2.append(sg);
      if (p?.veggie) { const vg = btn("🌱 Veggie", "vgb", () => { l.veggie = !l.veggie; pintarTicket(); }); vg.setAttribute("aria-pressed", String(l.veggie)); r2.append(vg); }
      if (p?.extras) carta.extras.filter((e) => !e.agotado).forEach((e) => r2.append(stp("+" + e.nombre.replace(/^extra\s*/i, ""), () => l.ext[e.id] || 0, (v) => (l.ext[e.id] = v))));
    }
    r.append(r1, r2); box.append(r);
  });
  $("mtotal").textContent = money(ticket.reduce((s, l) => s + precioLinea(l), 0));
  $("mok").disabled = !ticket.length;
}
document.querySelectorAll("[data-pago]").forEach((b) => (b.onclick = () => { pago = b.dataset.pago; document.querySelectorAll("[data-pago]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }));
const cerrarM = () => $("mdlg").classList.remove("open");
$("mostbtn").onclick = abrirMostrador; $("mclose").onclick = $("mbd").onclick = cerrarM;
$("mok").onclick = async () => {
  if (!ticket.length) return;
  const items = ticket.map((l) => ({ id: l.id, cantidad: l.cantidad, ...(l.tam ? { tamano: l.tamano, veggie: l.veggie, extras: Object.entries(l.ext).flatMap(([id, n]) => Array(n).fill(id)) } : {}) }));
  $("mok").disabled = true;
  try {
    const r = await api("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mostrador: { items, pago, nombre: $("mnombre").value } }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || "Error");
    tst(`✓ Venta #${d.id} a cocina · ${money(d.total)}`); ticket = []; $("mnombre").value = ""; cerrarM(); load();
  } catch (e) { tst(e.message, 1); } finally { $("mok").disabled = false; }
};
$("lb").onclick = () => $("lb").classList.remove("open");
addEventListener("keydown", (e) => { if (e.key === "Escape") { $("lb").classList.remove("open"); cerrarM(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { document.title = "Pedidos · Flama"; load(); } });
(async () => {
  key = await sesion("flama_local", async (k) => (await fetch("/api/orders?comp=0", { headers: { "x-flama-key": k } })).ok, "Panel de pedidos");
  $("fichlink").href = `/fichar#key=${encodeURIComponent(key)}`;
  // Cada 8 s con pedidos en curso o movimiento reciente; cada 30 s si está todo quieto; nada si la pantalla está oculta
  load(true);
  const tick = () => {
    const activos = [...ORD.values()].some((o) => ACTIVOS.includes(o.estado));
    const espera = activos || Date.now() - ultimoCambio < 10 * 60e3 ? 8000 : 30000;
    // Primero pregunta a la caché de Vercel si hubo cambios (no gasta Upstash); solo si cambió, pide los pedidos
    setTimeout(async () => {
      if (!document.hidden) {
        try {
          const e = await (await fetch("/api/estado")).json();
          if (e.bot !== botOn) { botOn = e.bot; paintBot(); }
          if (e.v !== ver) await load();
        } catch { await load(); }
      }
      tick();
    }, espera);
  };
  tick();
})();
</script>
