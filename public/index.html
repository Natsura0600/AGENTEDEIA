<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente WhatsApp · Picture Web Dev</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #0a0a0a; color: #f5f5f5;
         min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card { width: 100%; max-width: 420px; border: 1px solid #2a2a2a; padding: 36px 28px; text-align: center; }
  .brand { font-size: 11px; letter-spacing: .3em; color: #888; text-transform: uppercase; }
  h1 { font-size: 22px; font-weight: 600; margin: 10px 0 24px; }
  input, button { width: 100%; padding: 14px; font-size: 15px; border: 1px solid #333; background: #111; color: #fff; }
  button { margin-top: 10px; background: #fff; color: #000; font-weight: 600; cursor: pointer; border-color: #fff; }
  button.ghost { background: transparent; color: #aaa; border-color: #333; font-weight: 400; }
  button:disabled { opacity: .5; cursor: default; }
  #qr { width: 280px; height: 280px; margin: 8px auto 16px; background: #fff; padding: 10px; display: none; }
  .msg { color: #bbb; font-size: 14px; line-height: 1.5; margin: 14px 0; }
  .ok { font-size: 46px; margin-bottom: 8px; }
  ol { text-align: left; color: #999; font-size: 13px; line-height: 1.7; padding-left: 18px; margin: 10px 0 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Picture Web Dev</div>
  <h1>Agente de WhatsApp</h1>

  <div id="login" class="hidden">
    <input id="key" type="password" placeholder="Contraseña de admin" autocomplete="current-password">
    <button id="enter">Entrar</button>
    <p class="msg" id="loginMsg"></p>
  </div>

  <div id="panel" class="hidden">
    <div id="connected" class="hidden">
      <div class="ok">✅</div>
      <p class="msg">WhatsApp vinculado. El agente revisa y contesta los mensajes cada 2 minutos.</p>
      <button class="ghost" id="unlink">Desvincular y volver a empezar</button>
    </div>
    <div id="linking" class="hidden">
      <img id="qr" alt="QR de WhatsApp">
      <p class="msg" id="linkMsg">Preparando…</p>
      <button id="start">Generar QR</button>
      <ol>
        <li>Abrí WhatsApp en el celular</li>
        <li>Configuración → Dispositivos vinculados</li>
        <li>Vincular dispositivo y escaneá este código</li>
      </ol>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let key = "";
  try { key = sessionStorage.getItem("k") || ""; } catch {}
  let timer;

  async function api(path, method = "GET") {
    const r = await fetch(`/api/${path}?key=${encodeURIComponent(key)}`, { method });
    if (r.status === 401) throw new Error("auth");
    return r.json();
  }

  function show(state, qr) {
    $("login").classList.add("hidden");
    $("panel").classList.remove("hidden");
    $("connected").classList.toggle("hidden", state !== "connected");
    $("linking").classList.toggle("hidden", state === "connected");
    const img = $("qr");
    if (qr) { img.src = qr; img.style.display = "block"; } else img.style.display = "none";
    const texts = {
      idle: "Tocá el botón para generar el QR.",
      waiting: qr ? "Escaneá el código. Se renueva solo cada 20 segundos." : "Generando el QR, esperá unos segundos…",
      expired: "Se venció el tiempo. Generá un QR nuevo.",
      error: "Hubo un problema. Probá generar el QR de nuevo.",
    };
    $("linkMsg").textContent = texts[state] || "";
    $("start").classList.toggle("hidden", state === "waiting");
    if (state === "connected") clearInterval(timer);
  }

  async function poll() {
    try { const s = await api("status"); show(s.status, s.qr); }
    catch (e) { if (e.message === "auth") logout(); }
  }

  function logout() {
    clearInterval(timer);
    try { sessionStorage.removeItem("k"); } catch {}
    $("panel").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("loginMsg").textContent = "Contraseña incorrecta.";
  }

  async function enter() {
    try { await api("status"); } catch { return logout(); }
    try { sessionStorage.setItem("k", key); } catch {}
    poll();
    clearInterval(timer);
    timer = setInterval(poll, 3000);
  }

  $("enter").onclick = enter;
  $("key").onkeydown = (e) => e.key === "Enter" && enter();
  $("start").onclick = async () => {
    $("start").disabled = true;
    await api("link", "POST").catch(() => {});
    $("start").disabled = false;
    clearInterval(timer);
    timer = setInterval(poll, 3000);
    poll();
  };
  $("unlink").onclick = async () => {
    if (!confirm("¿Desvincular WhatsApp del agente?")) return;
    await api("status", "DELETE");
    timer = setInterval(poll, 3000);
    poll();
  };
  enter();
</script>
</body>
</html>
